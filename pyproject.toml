[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnd-mne-converter"
version = "0.1.0.dev0"
description = "Bidirectional conversion between CND datasets and MNE-Python objects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "mne>=1.8",
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.scripts]
cnd-mne = "cnd_mne.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnd_mne"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
