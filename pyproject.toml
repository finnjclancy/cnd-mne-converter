[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnd-mne-converter"
version = "0.1.0.dev0"
description = "Convert CND MATLAB files to MNE-Python and back"
readme = "README.md"
authors = [{ name = "Finn Clancy" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["CND", "EEG", "fNIRS", "MNE", "neuroscience", "speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.11",
  "hdf5storage>=0.2.2",
  "mne>=1.8",
  "numpy>=1.26",
  # MNE 1.8 imports scipy.special.sph_harm, removed in SciPy 1.17.
  "scipy>=1.12,<1.17",
]

[project.scripts]
cnd-mne = "cnd_mne.cli:main"

[project.urls]
Repository = "https://github.com/finnjclancy/cnd-mne-converter"
Issues = "https://github.com/finnjclancy/cnd-mne-converter/issues"
Changelog = "https://github.com/finnjclancy/cnd-mne-converter/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
  "mypy>=1.18,<2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnd_mne"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
