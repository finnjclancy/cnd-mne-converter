name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=cnd_mne --cov-report=term --cov-fail-under=95
      - run: uv build

  mne-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            python-version: "3.10"
            mne-version: "mne==1.8.*"
            scipy-version: "scipy<1.17"
          - label: latest
            python-version: "3.13"
            mne-version: "mne>=1.8"
            scipy-version: "scipy<1.17"
    name: MNE ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv sync --extra dev
      - run: >-
          uv pip install --upgrade
          "${{ matrix.mne-version }}"
          "${{ matrix.scipy-version }}"
      - run: uv run --no-sync pytest
